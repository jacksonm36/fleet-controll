# Fleet controller — standard nginx TLS termination (like a normal web server).
# Installed by scripts/setup-fleet-tls-nginx.sh
#
#   ssl_certificate     /etc/fleet/ssl/fullchain.pem
#   ssl_certificate_key /etc/fleet/ssl/privkey.pem
#
# Replace those paths with your own certificate (e.g. Let's Encrypt) and:
#   sudo nginx -t && sudo systemctl reload nginx

upstream fleet_web {
	server 127.0.0.1:3001;
	keepalive 8;
}

upstream fleet_api {
	server 127.0.0.1:4000;
	keepalive 8;
}

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;
	listen [::]:80;
	server_name ${FLEET_DOMAIN};
	return 301 https://$host$request_uri;
}

# Next.js on loopback :3001 (nginx :3000 is TLS redirect only; Grafana uses :3002)
server {
	listen 3000 ssl;
	listen [::]:3000 ssl;
	server_name ${FLEET_DOMAIN};
	ssl_certificate     /etc/fleet/ssl/fullchain.pem;
	ssl_certificate_key /etc/fleet/ssl/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name ${FLEET_DOMAIN};

	ssl_certificate     /etc/fleet/ssl/fullchain.pem;
	ssl_certificate_key /etc/fleet/ssl/privkey.pem;
	ssl_session_timeout 1d;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

	add_header Strict-Transport-Security "max-age=31536000" always;

	client_max_body_size 4m;

	location /health {
		proxy_pass http://fleet_api;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Agent long-poll websocket — needs long proxy timeouts (default 60s causes close 1006).
	location /api/agent/v1/stream {
		include /etc/nginx/fleet-mtls.conf;
		proxy_pass http://fleet_api;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}

	location /api/ {
		include /etc/nginx/fleet-mtls.conf;
		proxy_pass http://fleet_api;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}

	location / {
		proxy_pass http://fleet_web;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
