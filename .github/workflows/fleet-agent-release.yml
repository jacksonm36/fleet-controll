# Build fleet-agent Linux binaries and attach to GitHub Releases (optional fast install).
name: fleet-agent-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: fleet-agent-linux-amd64
          - target: aarch64-unknown-linux-gnu
            asset: fleet-agent-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        working-directory: rust-agent
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage asset
        run: |
          cp "rust-agent/target/${{ matrix.target }}/release/fleet-agent" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
